  <g fill="#C9A36A">
    <circle cx="90" cy="368" r="3.5"/><circle cx="110" cy="368" r="3.5"/><circle cx="130" cy="368" r="3.5"/><circle cx="150" cy="368" r="3.5"/>
    <circle cx="170" cy="368" r="3.5"/><circle cx="190" cy="368" r="3.5"/><circle cx="210" cy="368" r="3.5"/><circle cx="230" cy="368" r="3.5"/>
    <circle cx="250" cy="368" r="3.5"/><circle cx="270" cy="368" r="3.5"/><circle cx="290" cy="368" r="3.5"/><circle cx="310" cy="368" r="3.5"/>
